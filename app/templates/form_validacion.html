{% extends "base.html" %}
{% block content %}

<h1>Bienvenido</h1>
<h4>Conteo de RDP <small>Fecha: {{ fecha_consulta.strftime("%Y/%m/%d") }}</small></h4>


<!-- <div class="stats"> -->
<div class="content">
        <div class="card">
            <h2> <a href="/tabla-poligraf/lista_rdp" style="text-decoration: none; color: black;">Pendientes</a></h2>
            <p>{{ pendientes }}</p>
        </div>

        <div class="card">
            <h2> Aprobadas </h2>
            <p>{{ aprobados }}</p>
        </div>

        <div class="card">
            <h2> Rechazados </h2>
            <p>{{ rechazados }}</p>
        </div>

        <div class="card">
            <h2>Conteo semanal</h2>
            <p> {{ conteo_semanal }} </p>
        </div>
</div>

{% endblock %}
