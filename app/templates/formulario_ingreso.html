<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tridente - Inicio de Sesión</title>
    <link rel="stylesheet" href="/app/static/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117; /* Fondo oscuro tipo index */
            font-family: "Segoe UI", sans-serif;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #161b22; /* Caja oscura */
            padding: 40px;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            border: 1px solid #30363d;
        }

        .title-logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #58a6ff; /* Azul Tridente */
        }

        .login-container--label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c9d1d9;
        }

        .login-container--input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 15px;
        }

        login-container--input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 5px #58a6ff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #238636; /* Verde estilo GitHub */
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #2ea043;
        }

        .footer-text {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #8b949e;
        }

        .footer-text a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="body-login-container">

    <div class="login-container">
        <div class="title-logo">Tridente</div>

        <form action="/inicio_secion" method="post" enctype="application/x-www-form-urlencoded">
            <label class="login-container--label" for="email">Correo Electrónico</label>
            <input class="login-container--input" type="text" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input class="login-container--input" type="password" id="password" name="password" required>

            <button class="btn-login" type="submit">Ingresar</button>
        </form>

        <div class="footer-text">
            © 2026 Tridente — Plataforma Analítica  
        </div>
    </div>

</body>
</html>
