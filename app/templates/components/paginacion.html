<div class="pagination">
    {% if offset > 0 %}
    <a class="btn btn-edit" href="/tabla-base-esp/resultados_poligraficos?limit={{ limit }}&offset={{ offset - limit }}">
        Anterior
    </a>
    {% endif %}

    {% if resultados|length == limit %}
    <a class="btn btn-edit" href="/tabla-base-esp/resultados_poligraficos?limit={{ limit }}&offset={{ offset + limit }}">
        Siguiente
    </a>
    {% endif %}
</div>
